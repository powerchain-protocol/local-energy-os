apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: powerchain-platform
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [platform.powerchain.example]
      secretName: powerchain-platform-tls
  rules:
    - host: platform.powerchain.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: powerchain-platform, port: { number: 80 } } }
