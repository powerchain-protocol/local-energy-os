name: powerchain-local-energy-os
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: powerchain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powerchain"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - powerchain_postgres:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - powerchain_redis:/data
volumes:
  powerchain_postgres:
  powerchain_redis:
