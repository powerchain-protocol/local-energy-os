openapi: 3.1.0
x-powerchain-transports:
  rest: /api/v1
  websocket: ws://localhost:3012/v1/events
  grpc: localhost:50051
info:
  title: PowerChain Local Energy OS API
  version: 1.0.0
  summary: Canonical API for PowerChain Local Energy OS.
  description: |
    Context-aware API v1 for verified physical energy, kWh/MWh Energy RWAs,
    participants, grid operations, EV charging, SaaS entitlements, PWRC,
    cross-chain routing, supply-chain provenance and platform health.

    Core invariants:
    - Physical energy remains authoritative.
    - PWRC is native to Solana; wPWRC is its 1:1 Sui bridge representation.
    - Active Energy RWA representations cannot exceed verified Wh backing.
    - Payment confirmation does not prove physical energy delivery.
servers:
  - url: http://localhost:3002
    description: Local development
  - url: https://api.powerchain.ventures
    description: Production
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Participants
  - name: Energy Ledger
  - name: Energy RWA
  - name: Grid
  - name: Charging
  - name: Generation
  - name: PWRC
  - name: SaaS
  - name: Cross-chain
  - name: Oracles
  - name: Supply Chain
  - name: Authentication
  - name: Operations
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: API health
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/health:
    get:
      tags: [System]
      summary: Platform subsystem health
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/storage:
    get:
      tags: [System]
      summary: Storage capability status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/participants/summary:
    get:
      tags: [Participants]
      summary: Participant summary for the current context
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/prosumers:
    get:
      tags: [Participants]
      summary: List prosumers
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/consumers:
    get:
      tags: [Participants]
      summary: List consumers
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/clients:
    get:
      tags: [Participants]
      summary: List client accounts
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/grid-operators:
    get:
      tags: [Participants]
      summary: List grid operators
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy/command-center:
    get:
      tags: [Energy Ledger]
      summary: Get the Energy Command Center projection
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-proofs:
    get:
      tags: [Energy Ledger]
      summary: List Energy Proofs
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Energy Ledger]
      summary: Create an Energy Proof from validated meter evidence
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnergyProofInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/energy-batches:
    get:
      tags: [Energy Ledger]
      summary: List verified Energy Batches
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Energy Ledger]
      summary: Create an Energy Batch from a verified Energy Proof
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnergyBatchInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/energy-positions:
    get:
      tags: [Energy RWA]
      summary: List Energy Positions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Energy RWA]
      summary: Issue a kWh or MWh Energy Position against verified backing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueEnergyPositionInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/energy-reservations:
    get:
      tags: [Energy RWA]
      summary: List Energy RWA reservations
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Energy RWA]
      summary: Reserve part of an Energy Position
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionAmountInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/energy-retirements:
    get:
      tags: [Energy RWA]
      summary: List Energy RWA retirements
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Energy RWA]
      summary: Retire delivered or settled energy from an Energy Position
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionAmountInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/energy-rwa/units:
    get:
      tags: [Energy RWA]
      summary: Get canonical Wh/kWh/MWh unit definitions
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/grid/areas:
    get:
      tags: [Grid]
      summary: List grid areas
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/charging/stations:
    get:
      tags: [Charging]
      summary: List EV charging stations
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/charging/sessions:
    get:
      tags: [Charging]
      summary: List charging sessions
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/plants:
    get:
      tags: [Generation]
      summary: List power plants
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/wind-farms:
    get:
      tags: [Generation]
      summary: List wind farms
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/pwrc/bridge/quote:
    post:
      tags: [PWRC]
      summary: Quote a PWRC Solana to wPWRC Sui bridge operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountBaseUnits]
              properties:
                amountBaseUnits:
                  type: string
                  pattern: '^[0-9]+$'
                  example: '1000000000'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/cross-chain/routes:
    get:
      tags: [Cross-chain]
      summary: List enabled cross-chain routes
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/oracles/status:
    get:
      tags: [Oracles]
      summary: Get oracle-router provider status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/supply-chain/passports:
    get:
      tags: [Supply Chain]
      summary: List energy-infrastructure asset passports
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/apps:
    get:
      tags: [SaaS]
      summary: List SaaS application catalog
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/tenant/{organizationId}:
    get:
      tags: [SaaS]
      summary: Get SaaS tenant state by organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/entitlements/resolve:
    post:
      tags: [SaaS]
      summary: Resolve a SaaS application entitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, app]
              properties:
                plan: { type: string, example: ENTERPRISE }
                app: { type: string, example: ENERGY }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/auth/solana/challenge:
    post:
      tags: [Authentication]
      summary: Create a short-lived Solana authentication challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, origin, cluster]
              properties:
                wallet:
                  type: string
                  example: 7Xa3ExampleWallet11111111111111111111111111
                origin:
                  type: string
                  format: uri
                  example: http://localhost:3000
                cluster:
                  type: string
                  example: solana:devnet
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      summary: Get the current authenticated PowerChain session
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Authentication]
      summary: Revoke the current PowerChain session
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/solana/verify:
    post:
      tags: [Authentication]
      summary: Verify a signed Solana authentication challenge and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifySolanaChallengeInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/realtime/tickets:
    post:
      tags: [Realtime]
      summary: Issue a short-lived WebSocket ticket
      description: Issues an organization-scoped HMAC ticket for the PowerChain realtime gateway. Requires an authenticated session or explicitly enabled development identity headers.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topics:
                  type: array
                  items:
                    type: string
                    enum: [system, energy, market, settlement, devices, rewards, cross-chain, audit]
      responses:
        '201':
          description: Realtime ticket issued
          content:
            application/json:
              schema:
                type: object
        '401': { description: Authentication or organization context required }
        '503': { description: Realtime ticket service is not configured }

  /api/v1/system/solana:
    get:
      tags: [System]
      operationId: getSolanaRuntime
      summary: Inspect sanitized Solana/SVM runtime configuration
      description: Returns selected cluster, RPC provider, configured PowerChain program and PWRC identities, and standard Solana program IDs. Secrets and Helius API keys are never returned.
      responses:
        '200':
          description: Solana runtime configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/system/transports:
    get:
      tags: [System]
      summary: Discover PowerChain API transports
      responses:
        '200':
          description: REST, WebSocket and gRPC transport configuration
          content:
            application/json:
              schema:
                type: object

  /api/v1/config:
    get:
      tags: [System]
      summary: Sanitized public runtime configuration
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/status:
    get:
      tags: [System]
      summary: Runtime and subsystem status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/config:
    get:
      tags: [System]
      summary: Sanitized system configuration
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/management:
    get:
      tags: [System]
      summary: Fail-closed execution and management policy
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/ems/overview:
    get:
      tags: [Operations]
      summary: Get authorized EMS operational overview
      parameters:
        - in: query
          name: siteId
          required: true
          schema: { type: string }
      responses:
        '200': { description: EMS overview with source timestamps and freshness }
        '403': { description: Site access denied }
  /api/v1/iot/devices:
    get:
      tags: [Operations]
      summary: List authorized IoT devices for a site
      parameters:
        - in: query
          name: siteId
          required: true
          schema: { type: string }
      responses:
        '200': { description: IoT devices }
        '403': { description: Site access denied }
  /api/v1/depin/nodes:
    get:
      tags: [Operations]
      summary: List authorized DePIN nodes for a site
      parameters:
        - in: query
          name: siteId
          required: true
          schema: { type: string }
      responses:
        '200': { description: DePIN nodes }
        '403': { description: Site access denied }
  /api/v1/market-data/prices:
    get:
      tags: [Operations]
      summary: Get provider-neutral market prices
      parameters:
        - in: query
          name: symbols
          required: true
          schema: { type: string, example: 'SOL,PWRC' }
      responses:
        '200': { description: Market prices }
        '503': { description: Market-data provider unconfigured }
  /api/v1/actions/prepare:
    post:
      tags: [Operations]
      summary: Prepare a safe operational action without executing it
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [ems.dispatch.prepare, iot.device.refresh, depin.node.refresh, wallet.signature.prepare, settlement.prepare]
                siteId: { type: string }
                request: { type: object, additionalProperties: true }
      responses:
        '201': { description: Prepared idempotent intent; no execution endpoint is exposed }
        '403': { description: Site access denied }
        '428': { description: Idempotency key required }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for replay-safe economic mutations. Reusing the same key with a different request body is rejected.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    CreateEnergyProofInput:
      type: object
      required: [siteId, meterId, source, measuredWh, verifiedWh, qualityScore, intervalStart, intervalEnd, evidenceRoot]
      properties:
        siteId: { type: string }
        meterId: { type: string }
        source:
          type: string
          enum: [SOLAR, WIND, HYDRO, GEOTHERMAL, BIOMASS, GRID, STORAGE_DISCHARGE]
        measuredWh: { type: string, pattern: '^[1-9][0-9]*$' }
        verifiedWh: { type: string, pattern: '^[1-9][0-9]*$' }
        qualityScore: { type: string, example: '0.98' }
        intervalStart: { type: string, format: date-time }
        intervalEnd: { type: string, format: date-time }
        evidenceRoot: { type: string }
    CreateEnergyBatchInput:
      type: object
      required: [proofId]
      properties:
        proofId: { type: string }
    IssueEnergyPositionInput:
      type: object
      required: [batchId, amountWh, unit]
      properties:
        batchId: { type: string }
        amountWh: { type: string, pattern: '^[1-9][0-9]*$' }
        unit: { type: string, enum: [KWH, MWH] }
        canonicalChain: { type: string, enum: [SOLANA, SUI], default: SOLANA }
    PositionAmountInput:
      type: object
      required: [positionId, amountWh]
      properties:
        positionId: { type: string }
        amountWh: { type: string, pattern: '^[1-9][0-9]*$' }
        orderId: { type: string }
        reason: { type: string }
        settlementId: { type: string }
    VerifySolanaChallengeInput:
      type: object
      required: [wallet, nonce, signature]
      properties:
        wallet: { type: string }
        nonce: { type: string }
        signature: { type: string, description: Base58-encoded Ed25519 signature of the exact stored challenge message. }
    Meta:
      type: object
      properties:
        requestId: { type: string }
        correlationId: { type: string }
        generatedAt: { type: string, format: date-time }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Success:
      description: Successful PowerChain API response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: PowerChain API error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
