openapi: 3.1.0
info:
  title: PowerChain Local Energy OS API
  version: 1.0.0
  summary: Canonical API for PowerChain Local Energy OS.
  description: |
    Context-aware API v1 for verified physical energy, kWh/MWh Energy RWAs,
    participants, grid operations, EV charging, SaaS entitlements, PWRC,
    cross-chain routing, supply-chain provenance and platform health.

    Core invariants:
    - Physical energy remains authoritative.
    - PWRC is native to Solana; wPWRC is its 1:1 Sui bridge representation.
    - Active Energy RWA representations cannot exceed verified Wh backing.
    - Payment confirmation does not prove physical energy delivery.
servers:
  - url: http://localhost:3002
    description: Local development
  - url: https://api.powerchain.ventures
    description: Production
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Participants
  - name: Energy Ledger
  - name: Energy RWA
  - name: Grid
  - name: Charging
  - name: Generation
  - name: PWRC
  - name: SaaS
  - name: Cross-chain
  - name: Oracles
  - name: Supply Chain
  - name: Authentication
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: API health
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/health:
    get:
      tags: [System]
      summary: Platform subsystem health
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/system/storage:
    get:
      tags: [System]
      summary: Storage capability status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/participants/summary:
    get:
      tags: [Participants]
      summary: Participant summary for the current context
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/prosumers:
    get:
      tags: [Participants]
      summary: List prosumers
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/consumers:
    get:
      tags: [Participants]
      summary: List consumers
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/clients:
    get:
      tags: [Participants]
      summary: List client accounts
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/grid-operators:
    get:
      tags: [Participants]
      summary: List grid operators
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy/command-center:
    get:
      tags: [Energy Ledger]
      summary: Get the Energy Command Center projection
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-proofs:
    get:
      tags: [Energy Ledger]
      summary: List Energy Proofs
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-batches:
    get:
      tags: [Energy Ledger]
      summary: List verified Energy Batches
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-positions:
    get:
      tags: [Energy RWA]
      summary: List Energy Positions
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-reservations:
    get:
      tags: [Energy RWA]
      summary: List Energy RWA reservations
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-retirements:
    get:
      tags: [Energy RWA]
      summary: List Energy RWA retirements
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/energy-rwa/units:
    get:
      tags: [Energy RWA]
      summary: Get canonical Wh/kWh/MWh unit definitions
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/grid/areas:
    get:
      tags: [Grid]
      summary: List grid areas
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/charging/stations:
    get:
      tags: [Charging]
      summary: List EV charging stations
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/charging/sessions:
    get:
      tags: [Charging]
      summary: List charging sessions
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/plants:
    get:
      tags: [Generation]
      summary: List power plants
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/wind-farms:
    get:
      tags: [Generation]
      summary: List wind farms
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/pwrc/bridge/quote:
    post:
      tags: [PWRC]
      summary: Quote a PWRC Solana to wPWRC Sui bridge operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountBaseUnits]
              properties:
                amountBaseUnits:
                  type: string
                  pattern: '^[0-9]+$'
                  example: '1000000000'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/cross-chain/routes:
    get:
      tags: [Cross-chain]
      summary: List enabled cross-chain routes
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/oracles/status:
    get:
      tags: [Oracles]
      summary: Get oracle-router provider status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/supply-chain/passports:
    get:
      tags: [Supply Chain]
      summary: List energy-infrastructure asset passports
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/apps:
    get:
      tags: [SaaS]
      summary: List SaaS application catalog
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/tenant/{organizationId}:
    get:
      tags: [SaaS]
      summary: Get SaaS tenant state by organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/saas/entitlements/resolve:
    post:
      tags: [SaaS]
      summary: Resolve a SaaS application entitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, app]
              properties:
                plan: { type: string, example: ENTERPRISE }
                app: { type: string, example: ENERGY }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/auth/solana/challenge:
    post:
      tags: [Authentication]
      summary: Create a short-lived Solana authentication challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, origin, cluster]
              properties:
                wallet:
                  type: string
                  example: 7Xa3ExampleWallet11111111111111111111111111
                origin:
                  type: string
                  format: uri
                  example: http://localhost:3000
                cluster:
                  type: string
                  example: solana:devnet
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Meta:
      type: object
      properties:
        requestId: { type: string }
        correlationId: { type: string }
        generatedAt: { type: string, format: date-time }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    Success:
      description: Successful PowerChain API response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: PowerChain API error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
