name: powerchain

services:
  platform:
    build:
      context: ../../..
      dockerfile: packages/infrastructure/docker/Dockerfile
      target: runner
    image: powerchain/platform:1.0.0
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: ../../../.env.local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: powerchain
      POSTGRES_USER: powerchain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerchain}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerchain -d powerchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
