packages:
  - apps/*
  - packages/*
  - components/*
  - store
  - storage

# pnpm 11 build-script allowlist. This is the persisted result of reviewing
# `pnpm approve-builds` for the current dependency graph.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  '@tree-sitter-grammars/tree-sitter-yaml@0.7.1': true
  'tree-sitter-json@0.24.8': true
  'tree-sitter@0.21.1 || 0.22.4': true
  'core-js-pure@3.50.0': false
  '@scarf/scarf': false
