packages:
  - apps/*
  - packages/*
  - components/*
  - store
  - storage

# pnpm 11 build-script allowlist. This is the persisted result of reviewing
# `pnpm approve-builds` for the current dependency graph.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  'core-js-pure@3.50.0': false
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': set this to true or false
  tree-sitter: set this to true or false
  tree-sitter-json: set this to true or false
