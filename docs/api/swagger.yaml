openapi: 3.1.0
info:
  title: PowerChain API
  version: 1.0.0
  description: >-
    Versioned APIs for the PowerChain Digital Energy Operating System,
    including identity, AI, Proof of Energy, tokenization, cross-chain PWRC,
    marketplace settlement, smart meters, carbon, telemetry and platform configuration.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - { name: Identity }
  - { name: AI }
  - { name: Copilot }
  - { name: Energy }
  - { name: Digital Energy }
  - { name: Local Energy }
  - { name: Tokens }
  - { name: Bridge }
  - { name: Marketplace }
  - { name: Settlement }
  - { name: Platform }
paths:
  /auth/signin:
    post:
      tags: [Identity]
      summary: Sign in with email and password
      responses:
        "200": { description: Session created }
        "400": { description: Invalid request }
  /auth/signup:
    post:
      tags: [Identity]
      summary: Create a user and organization account
      responses:
        "201": { description: Account created }
  /sessions:
    get:
      tags: [Identity]
      summary: Read the current authenticated session
      responses:
        "200": { description: Session state }
  /ai/models:
    get:
      tags: [AI]
      summary: List GRIDLLM, LoRA and retrieval models
      responses:
        "200": { description: AI model catalog }
  /ai/agents:
    get:
      tags: [AI]
      summary: Compatibility agent endpoint; canonical workforce is exposed by /copilot/registry
      responses:
        "200": { description: Agent catalog }
  /ai/settings:
    get:
      tags: [AI]
      summary: Read PowerChain Copilot engine configuration
      responses:
        "200": { description: AI configuration }
  /chat:
    post:
      tags: [AI]
      summary: Legacy chat compatibility endpoint; canonical operator interface is PowerChain Copilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, message]
              properties:
                chatId: { type: [string, "null"] }
                userId: { type: string }
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { description: Assistant response }
        "400": { description: Prompt is invalid or outside PowerChain scope }
  /copilot/registry:
    get:
      tags: [Copilot]
      summary: Read the canonical PowerChain Copilot agent, skill and prompt registry
      responses:
        "200": { description: Copilot registry }
  /copilot/plan:
    post:
      tags: [Copilot]
      summary: Build a transparent RWA Orchestrator execution plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                mode: { type: string, enum: [ASK, ANALYZE, RESEARCH, ACT] }
                contexts:
                  type: array
                  maxItems: 12
                  items:
                    type: object
                    required: [type, id, label]
                    properties:
                      type: { type: string }
                      id: { type: string }
                      label: { type: string }
      responses:
        "200": { description: Orchestrator execution plan }
        "400": { description: Invalid Copilot request }
  /copilot/run:
    post:
      tags: [Copilot]
      summary: Coordinate Copilot agents and return analysis or an approval-safe action draft
      description: ACT mode creates a review-required draft. The Copilot service never signs wallet transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                mode: { type: string, enum: [ASK, ANALYZE, RESEARCH, ACT] }
                contexts: { type: array, maxItems: 12, items: { type: object } }
      responses:
        "201": { description: Coordinated Copilot result }
        "400": { description: Invalid request }
        "401": { description: ACT mode requires authenticated identity in production }
  /copilot/actions:
    get:
      tags: [Copilot]
      summary: List organization-isolated Copilot action drafts
      responses:
        "200": { description: Copilot Action Center records }
        "401": { description: Authentication required }
  /copilot/actions/{id}/approve:
    post:
      tags: [Copilot]
      summary: Explicitly approve a Copilot-prepared action
      description: Approval never signs a wallet transaction. Wallet-required actions move to AWAITING_WALLET.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Action approved }
        "401": { description: Authentication required }
        "404": { description: Action not found }
  /copilot/actions/{id}/reject:
    post:
      tags: [Copilot]
      summary: Reject a Copilot-prepared action
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Action rejected }
        "401": { description: Authentication required }
        "404": { description: Action not found }
  /copilot/actions/{id}/wallet-signature:
    post:
      tags: [Copilot]
      summary: Record an externally created wallet signature or transaction reference
      description: Copilot never signs transactions. This endpoint only records a signature/reference created through an external human wallet workflow.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletSignatureReference]
              properties:
                walletSignatureReference: { type: string, minLength: 8, maxLength: 256 }
      responses:
        "200": { description: External wallet reference recorded and action completed }
        "400": { description: Invalid wallet reference or action state }
        "401": { description: Authentication required }
        "404": { description: Action not found }
        "409": { description: Concurrent action decision conflict }
  /local-energy/health:
    get:
      tags: [Local Energy]
      summary: Read Local Energy OS service health and physical-authority contract
      responses:
        "200": { description: Local Energy service health }

  /local-energy/overview:
    get:
      tags: [Local Energy]
      summary: Read tenant-scoped Local Energy OS community, market, grid and settlement overview
      description: Physical electricity remains authoritative. Product-level status does not turn financial or blockchain confirmation into delivery proof.
      responses:
        "200": { description: Local Energy OS overview }
        "401": { description: LIVE tenant access requires authentication or signed trusted-service context }

  /local-energy/listings:
    get:
      tags: [Local Energy]
      summary: List canonical integer-Wh Local Energy listings
      responses:
        "200": { description: Tenant-scoped Local Energy listings }
    post:
      tags: [Local Energy]
      summary: Create an idempotent persistent Local Energy listing
      description: Listings express market intent and capacity. They are not physical delivery evidence.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      responses:
        "201": { description: Listing created }
        "400": { description: Invalid listing or idempotency key }
        "401": { description: Authentication required in LIVE mode }
        "403": { description: Operator lacks write authority }

  /local-energy/flexibility:
    get:
      tags: [Local Energy]
      summary: List tenant-scoped grid flexibility signals
      responses:
        "200": { description: Flexibility signals }
    post:
      tags: [Local Energy]
      summary: Create a physically backed grid flexibility signal
      description: requestedKwh cannot exceed availableKwh and the time window must be valid.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      responses:
        "201": { description: Flexibility signal created }
        "409": { description: Requested flexibility exceeds available physical capacity }

  /p2p/community:
    get:
      tags: [Local Energy]
      summary: Compatibility API for local energy community metrics and recent tenant orders
      responses:
        "200": { description: Community summary }

  /p2p/listings:
    get:
      tags: [Local Energy]
      summary: Compatibility API for grid-aware Local Energy listings
      responses:
        "200": { description: Local Energy listings }

  /p2p/orders:
    get:
      tags: [Local Energy]
      summary: List organization-isolated Local Energy orders
      responses:
        "200": { description: Local Energy orders }
    post:
      tags: [Local Energy]
      summary: Atomically reserve Local Energy listing capacity for review
      description: The server ignores caller-supplied buyer identity in LIVE mode and binds the order to authenticated tenant identity. Inventory reservation is serialized and idempotent.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      responses:
        "201": { description: REVIEW_REQUIRED Local Energy order created }
        "400": { description: Invalid order }
        "401": { description: Authentication required in LIVE mode }
        "403": { description: Write authority required }
        "409": { description: Listing unavailable, capacity exceeded, grid limit exceeded, or listing expired }

  /p2p/orders/{id}:
    get:
      tags: [Local Energy]
      summary: Read one organization-isolated Local Energy order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Local Energy order }
        "404": { description: Order not found in this organization }
    patch:
      tags: [Local Energy]
      summary: Advance a Local Energy order through the evidence-gated delivery and settlement lifecycle
      description: Direct settlement jumps are rejected. Meter evidence is required before reconciliation; reconciliation is required before settlement-ready state; external settlement reference is required before SETTLED.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [CONFIRM_RESERVATION, START_DELIVERY, RECORD_DELIVERY, RECONCILE, MARK_SETTLEMENT_READY, MARK_SETTLED, CANCEL, DISPUTE]
                reservationReference: { type: string }
                deliveredKwh: { type: number, minimum: 0 }
                meterEvidenceRoot: { type: string }
                toleranceKwh: { type: number, minimum: 0 }
                settlementReference: { type: string }
      responses:
        "200": { description: Order transitioned }
        "400": { description: Required evidence/reference missing }
        "404": { description: Order not found }
        "409": { description: Invalid lifecycle transition or concurrent update }
  /measurements:
    post:
      tags: [Energy]
      summary: Submit a signed smart-meter measurement
      responses:
        "201": { description: Measurement accepted }
  /measurements/batch:
    post:
      tags: [Energy]
      summary: Submit a batch of smart-meter measurements
      responses:
        "201": { description: Measurements accepted }
  /attestations:
    post:
      tags: [Energy]
      summary: Create a DePIN oracle attestation
      responses:
        "201": { description: Attestation created }
  /proof-of-energy/verify:
    post:
      tags: [Energy]
      summary: Verify an energy measurement and oracle consensus
      responses:
        "200": { description: Verification result }
  /tokens/energy/mint:
    post:
      tags: [Tokens]
      summary: Mint a verified kWh or MWh token
      responses:
        "201": { description: Energy token prepared or minted }
  /tokens/energy/burn:
    post:
      tags: [Tokens]
      summary: Burn an energy token
      responses:
        "200": { description: Burn recorded }
  /tokens/energy/retire:
    post:
      tags: [Tokens]
      summary: Retire an energy token and preserve provenance
      responses:
        "200": { description: Retirement recorded }
  /bridge/pwrc/quote:
    get:
      tags: [Bridge]
      summary: Quote a PowerChain ↔ Solana PWRC transfer
      parameters:
        - in: query
          name: direction
          required: true
          schema: { type: string, enum: [powerchain-to-solana, solana-to-powerchain] }
        - in: query
          name: amount
          required: true
          schema: { type: string, example: "1000.0" }
      responses:
        "200": { description: Bridge quote }
        "400": { description: Invalid direction or amount }
  /bridge/pwrc/transfer:
    post:
      tags: [Bridge]
      summary: Prepare a signature-required PWRC bridge transfer
      description: Solana PWRC circulating supply must never exceed native PWRC locked for the Solana integration.
      responses:
        "201": { description: Transfer prepared }
        "400": { description: Validation error }
  /marketplace/orders:
    post:
      tags: [Marketplace]
      summary: Create a marketplace order
      responses:
        "201": { description: Order created }
  /settlements:
    post:
      tags: [Settlement]
      summary: Create a signature-required settlement
      responses:
        "201": { description: Settlement created }
  /transactions:
    post:
      tags: [Settlement]
      summary: Prepare a validated Solana, Sui or EVM transaction
      responses:
        "201": { description: Transaction prepared }
        "400": { description: Validation error }
  /status:
    get:
      tags: [Platform]
      summary: Read platform and integration status
      responses:
        "200": { description: Platform status }
  /config/networks:
    get:
      tags: [Platform]
      summary: List supported Solana and Sui networks without secrets
      responses:
        "200": { description: Network catalog }
  /api/v1/certification/programs:
    get:
      summary: List certification programs
      responses:
        "200": { description: Certification programs }
  /api/v1/certification/certificates:
    get:
      summary: List tokenized certificates
      responses:
        "200": { description: Certificates }
    post:
      summary: Request certificate issuance
      responses:
        "202": { description: Issuance accepted }
  /api/v1/energy/prices:
    get:
      summary: Fetch sourced regional energy prices and tariffs
      parameters:
        - in: query
          name: region
          schema: { type: string }
      responses:
        "200": { description: Explicit provider-state price records }
  /api/v1/payments:
    post:
      summary: Create a decimal-safe payment authorization
      responses:
        "201": { description: Payment authorization created }
  /digital-energy/overview:
    get:
      tags: [Digital Energy]
      summary: Read the organization-scoped Digital Energy OS snapshot
      description: Returns explicit LIVE, DEMO, or DEGRADED data mode with verified energy, Energy RWA, Asset Graph, network and provider state.
      responses:
        "200": { description: Digital Energy snapshot }
        "503": { description: Configured Digital Energy database unavailable }
  /digital-energy/positions:
    get:
      tags: [Digital Energy]
      summary: List canonical Energy Positions
      responses:
        "200": { description: Energy Position list }
    post:
      tags: [Digital Energy]
      summary: Issue a canonical Energy Position from finalized verified backing
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      responses:
        "201": { description: Energy Position created }
        "409": { description: Verified backing invariant rejected the issuance }
  /digital-energy/positions/{id}/backing:
    get:
      tags: [Digital Energy]
      summary: Read current canonical backing and Solana/Sui allocation for an Energy Position
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Current position backing }
  /digital-energy/positions/{id}/reserve:
    post:
      tags: [Digital Energy]
      summary: Reserve canonical Wh for a delivery or market commitment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "201": { description: Reservation created }
  /digital-energy/reservations/{id}/release:
    post:
      tags: [Digital Energy]
      summary: Release an active Energy Position reservation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Reservation released }
  /digital-energy/positions/{id}/representations:
    post:
      tags: [Digital Energy]
      summary: Allocate canonical Energy Position backing to Solana or Sui PET-20 representation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "201": { description: Chain representation created }
        "409": { description: Cross-chain representation would exceed backing }
  /digital-energy/representations/{id}/retire:
    post:
      tags: [Digital Energy]
      summary: Retire an active Solana/Sui representation while preserving canonical backing
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Representation retired }
  /digital-energy/positions/{id}/retire:
    post:
      tags: [Digital Energy]
      summary: Retire the remaining canonical Energy Position backing
      description: Active reservations and chain representations must be cleared first.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Position retirement recorded }
        "409": { description: Active economic state or backing invariant blocks retirement }
  /digital-energy/asset-graph:
    get:
      tags: [Digital Energy]
      summary: Read the canonical Site → Batch → Position → Representation graph
      responses:
        "200": { description: Tenant Asset Graph }
  /digital-energy/prices:
    get:
      tags: [Digital Energy]
      summary: Fetch explicit Pyth, Birdeye, CoinMarketCap and ECB/Frankfurter reference prices/rates
      description: Provider data is reference market data and never becomes authoritative for physical energy.
      parameters:
        - { in: query, name: pythFeedId, schema: { type: string } }
        - { in: query, name: birdeyeAddress, schema: { type: string } }
        - { in: query, name: symbols, schema: { type: string, example: "SOL,SUI,USDC" } }
        - { in: query, name: fxBase, schema: { type: string, example: EUR } }
        - { in: query, name: fxSymbols, schema: { type: string, example: "USD,GBP,SEK,NOK,DKK,CHF" } }
      responses:
        "200": { description: Explicit provider-state market/reference data }
  /digital-energy/providers:
    get:
      tags: [Digital Energy]
      summary: Read explicit provider configuration/state for Pyth, Birdeye, CoinMarketCap, FX and explorers
      responses:
        "200": { description: Provider state }
  /digital-energy/standards:
    get:
      tags: [Digital Energy]
      summary: Read Wh and PET-20 canonical standards
      responses:
        "200": { description: Digital Energy standards }
  /digital-energy/reward-epoch:
    get:
      tags: [Digital Energy]
      summary: Read configured PowerChain reward epoch state
      description: Reports eligible verified Wh and epoch timing without inventing a PWRC conversion rate.
      responses:
        "200": { description: Reward epoch state }
  /digital-energy/audit:
    get:
      tags: [Digital Energy]
      summary: Read organization-scoped Digital Energy economic audit events
      responses:
        "200": { description: Audit events }
  /digital-energy/operations:
    get:
      tags: [Digital Energy]
      summary: Read the tenant Digital Twin, delivery, reconciliation and settlement operating snapshot
      responses:
        "200": { description: Digital Energy operations snapshot }
  /digital-energy/digital-twin:
    get:
      tags: [Digital Energy]
      summary: Read operational Digital Twin asset state and telemetry freshness
      responses:
        "200": { description: Tenant Digital Twin state }
    post:
      tags: [Digital Energy]
      summary: Upsert signed/validated operational telemetry into the tenant Digital Twin read model
      description: Telemetry freshness is derived from observedAt by the server. This endpoint does not mint energy or prove delivery.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Digital Twin asset updated }
  /digital-energy/deliveries:
    get:
      tags: [Digital Energy]
      summary: List physical delivery commitments and meter-evidenced delivery state
      responses:
        "200": { description: Delivery records }
    post:
      tags: [Digital Energy]
      summary: Create a delivery commitment from an active Energy Reservation
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "201": { description: Delivery commitment created }
        "409": { description: Delivery would exceed or does not reference active reserved backing }
  /digital-energy/deliveries/{id}/record:
    post:
      tags: [Digital Energy]
      summary: Record meter-evidenced physical delivery
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Delivery evidence recorded }
  /digital-energy/deliveries/{id}/reconcile:
    post:
      tags: [Digital Energy]
      summary: Reconcile committed and meter-delivered Wh using explicit tolerance
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Reconciliation calculated or approved }
  /digital-energy/settlements:
    get:
      tags: [Digital Energy]
      summary: List financial settlement state separated from physical delivery
      responses:
        "200": { description: Settlement records }
    post:
      tags: [Digital Energy]
      summary: Prepare a review-hash-bound financial settlement for a reconciled delivery
      description: LIVE financial preparation requires company/admin/super-admin or trusted-service authority. A prepared settlement remains READY until maker-checker controls are satisfied.
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "201": { description: Settlement proposal prepared with deterministic SHA-256 review hash }
        "403": { description: Caller lacks financial execution authority }
  /digital-energy/settlements/{id}/approval:
    post:
      tags: [Digital Energy]
      summary: Approve or reject the exact settlement review hash under maker-checker policy
      description: A settlement maker cannot satisfy checker approval. Decisions are bound to the deterministic POWERCHAIN_SETTLEMENT_REVIEW_V1 SHA-256 digest.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewHash]
              properties:
                approvalId: { type: string }
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reviewHash: { type: string, pattern: "^[a-f0-9]{64}$", description: Exact POWERCHAIN_SETTLEMENT_REVIEW_V1 SHA-256 digest }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Settlement control decision recorded }
        "400": { description: Invalid decision, review hash, note, or missing idempotency key }
        "403": { description: Caller lacks checker authority }
        "409": { description: Review hash mismatch, duplicate approver, rejection, or maker-checker violation }
  /digital-energy/controls:
    get:
      tags: [Digital Energy]
      summary: Read settlement controls, exact review-hash approval state and non-published transactional outbox events
      description: LIVE access is limited to settlement-checker-authorized roles.
      responses:
        "200": { description: Institutional Digital Energy control-plane snapshot }
        "403": { description: Caller lacks checker authority }
  /digital-energy/settlements/{id}/transition:
    post:
      tags: [Digital Energy]
      summary: Transition settlement state after institutional approval and external network or ledger execution
      description: READY to SUBMITTED is rejected until maker-checker controls are APPROVED. LIVE financial execution also requires company/admin/super-admin or trusted-service authority.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Settlement state transitioned }
        "403": { description: Caller lacks financial execution authority }
        "409": { description: Settlement control state does not permit submission }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: powerchain_session
